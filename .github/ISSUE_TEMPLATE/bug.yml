name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: repository
    attributes:
      label: Repository
      options:
        - backend
        - frontend
        - terraform
        - .github
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA, plus Node, Terraform or OS versions if relevant.
    validations:
      required: true
