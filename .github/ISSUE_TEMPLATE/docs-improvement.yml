name: Documentation improvement
description: A typo, a gap or an outdated chapter
labels: [documentation]
body:
  - type: dropdown
    id: repository
    attributes:
      label: Repository
      options:
        - backend
        - frontend
        - terraform
        - .github
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: File or chapter
      placeholder: guide/security.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
